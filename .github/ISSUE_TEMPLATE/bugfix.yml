name: "Bug / Defect Fix"
description: >
  Report and track a software defect as a QMS change record.
title: "[BUG] "
labels: ["type: bug-fix"]
assignees: []

body:

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 1 — DEFECT IDENTIFICATION
  # ─────────────────────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: 
        ## Section 1 — Defect Identification
        > **Purpose:** Establish a stable, traceable identity for this defect record.
        > The GitHub issue number is the permanent QMS Record ID — it is non-editable
        > and serves as the unique identifier across GitHub, GDrive, and all QMS references.
        > *Regulatory basis: ISO 13485 §4.2.4 · IEC 62304 §9.7*

  - type: input
    id: req_id
    attributes:
      label: Requirement / Defect ID
      description: >
        Enter the stable ID for this defect record. Format: BUG-[GitHub issue number].
        Example: BUG-2819. This ID must be used in all GDrive records, PR descriptions,
        and commit messages referencing this fix. It never changes after creation.
      placeholder: "BUG-[GitHub issue number] e.g. BUG-2819"
    validations:
      required: true

  - type: dropdown
    id: req_type
    attributes:
      label: Requirement Type
      description: >
        Pre-selected as Bug / Defect Fix. Do not change. This determines which
        QMS controls apply — CAPA process (QMSR §820.100), nonconforming output
        controls (ISO 13485 §8.3), and regression testing (IEC 62304 §5.7.4).
      options:
        - "Bug / Defect Fix"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: >
        Select the HippoMind module where the defect exists. This links the
        fix to the correct IEC 62304 software unit for traceability. If the
        defect spans multiple modules, select the primary affected module and
        list others in the description.
      options:
        - "Signal Review / Video"
        - "EEG / MEG Report Generation"
        - "Source Localization"
        - "File Store / S3"
        - "Hospital / User Settings"
        - "Authentication / Access Control"
        - "Backend / API"
        - "Frontend / UI"
        - "Database / Schema"
        - "Other — specify in description"
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Stage
      description: >
        Select the current lifecycle stage of this defect record. Update this
        field as the issue progresses. Stage must reflect the true current state —
        auditors check stage against PR merge dates and GDrive record timestamps.
      options:
        - "Open — defect identified, fix not yet started"
        - "In Progress — fix under development"
        - "Resolved — fix implemented, awaiting verification"
        - "Closed — verified, GDrive records complete, CTO sign-off done"
    validations:
      required: true

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 2 — DEFECT DESCRIPTION AND FIX
  # ─────────────────────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ---
        ## Section 2 — Defect Description & Fix
        > **Purpose:** Document what is broken and what the fix does. This is the
        > primary technical record for this defect. It must be complete enough
        > for a person unfamiliar with the code to understand the defect, its
        > impact, and the fix approach.
        > *Regulatory basis: QMSR §820.30(c) · QMSR §820.100*

  - type: textarea
    id: description
    attributes:
      label: Defect Description & Fix
      description: >
        Describe: (1) what is broken and how it manifests, (2) the root symptom
        observed by the user or developer, (3) what the fix does to correct it.
        Be specific — vague descriptions result in incomplete CAPA records and
        are a direct audit finding under QMSR §820.100.
      placeholder: |
        **What is broken:**
        [Describe the defect — what behaviour is incorrect and how it manifests]

        **Impact:**
        [Who or what is affected — user-facing, data integrity, clinical output, etc.]

        **Fix:**
        [Describe what code or configuration change corrects the defect]
    validations:
      required: true

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 3 — DETECTION STAGE
  # ─────────────────────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ---
        ## Section 3 — Detection Stage
        > **Purpose:** Record where in the software lifecycle this defect was
        > discovered. This is a mandatory field because the detection stage
        > determines which regulatory obligations apply:
        > - **Development / QA / Staging** → internal CAPA only
        > - **Production** → additionally requires MDR reportability assessment
        >   (FDA §803, 30-day clock from discovery), HIPAA PHI breach assessment
        >   (45 CFR §164.408), and patient safety impact determination.
        > *Regulatory basis: QMSR §820.100 · FDA §803 · HIPAA §164.308(a)(6)*

  - type: dropdown
    id: detection_stage
    attributes:
      label: Defect Detected At
      description: >
        Select where this defect was first identified. Be accurate — if a defect
        was present in production but only discovered during a code review,
        select Production. The detection stage starts regulatory clocks.
        Production detection requires completing the conditional block below.
      options:
        - "Development — caught during coding or unit testing"
        - "QA Testing — caught during integration or QA testing"
        - "Staging — caught in staging environment before production release"
        - "Production — defect was present in the live production environment"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### ⚠ Conditional Block — Production Impact Assessment
        **Complete this block ONLY IF "Defect Detected At" = Production.**
        If detected at Development, QA Testing, or Staging — enter N/A in each
        field below with a brief reason.

        **Basis:** Detection Stage = Production activates FDA §803 MDR reporting
        obligations, HIPAA §164.408 breach notification assessment, and ISO 14971
        patient safety impact determination. These must be completed within 30 days
        of production defect discovery for Class II SaMD devices.

  - type: input
    id: exposure_window
    attributes:
      label: "⚠ [Production only] Exposure Window"
      description: >
        Date the defect was first present in production (approximate if unknown)
        and date the fix was deployed. Required to assess the MDR 30-day reporting
        window and HIPAA breach exposure period. Enter N/A with reason if not applicable.
      placeholder: "First in production: YYYY-MM-DD | Fix deployed: YYYY-MM-DD | N/A — detected at [stage]"
    validations:
      required: true

  - type: input
    id: versions_affected
    attributes:
      label: "⚠ [Production only] Product Versions Affected"
      description: >
        List all HippoMind version numbers that contained this defect in production.
        Required for FDA MDR assessment and to determine scope of any customer
        notification obligation. Enter N/A if not a production defect.
      placeholder: "e.g. v2.4.0, v2.4.1 | N/A — not a production defect"
    validations:
      required: true

  - type: checkboxes
    id: patient_safety
    attributes:
      label: "⚠ [Production only] Patient Safety Impact"
      description: >
        Assess whether this defect could have caused or contributed to patient
        harm. For a Class II SaMD processing EEG/MEG data, consider: incorrect
        clinical output, data corruption, misidentification of patient records,
        or inaccessible clinical tools during active patient review.
        ISO 14971 §9 requires this determination for all production defects.
        Select one and provide rationale in the checkbox label space.
      options:
        - label: "No patient safety impact — rationale: [replace this text with your reason, e.g. defect was UI-only and did not affect clinical data or output]"
        - label: "Potential patient safety impact — describe: [replace this text with impact description and action taken]"
    validations:
      required: true

  - type: checkboxes
    id: mdr_reportability
    attributes:
      label: "⚠ [Production only] MDR Reportability Assessment"
      description: >
        Under FDA 21 CFR §803, a Class II medical device manufacturer must submit
        a Medical Device Report within 30 days if a device malfunction could cause
        or contribute to serious injury or death if it were to recur. The CTO must
        make and document this determination. If reportable, file MDR with FDA.
        30-day clock starts from the date of production defect discovery.
      options:
        - label: "Not MDR reportable — rationale: [replace with reason, e.g. defect did not affect clinical output and could not cause patient harm]"
        - label: "MDR reportable — MDR submission date: [YYYY-MM-DD, must be within 30 days of discovery date]"
    validations:
      required: true

  - type: checkboxes
    id: phi_breach
    attributes:
      label: "⚠ [Production only] HIPAA PHI Breach Assessment"
      description: >
        The CTO as HIPAA Security Officer must assess whether this production
        defect resulted in unauthorised access to, use of, or disclosure of PHI.
        If a breach occurred or cannot be ruled out, HIPAA §164.408 requires
        notification to HHS within 60 days of discovery. Document this determination
        regardless of outcome — absence of a documented assessment is itself a
        HIPAA compliance gap.
      options:
        - label: "No PHI breach — rationale: [replace with reason, e.g. defect was in UI rendering layer with no access to PHI data store]"
        - label: "PHI breach confirmed or cannot be ruled out — action taken: [replace with action, e.g. HHS notification initiated on YYYY-MM-DD]"
    validations:
      required: true

  - type: input
    id: hipaa_officer_signoff
    attributes:
      label: "⚠ [Production only] HIPAA Security Officer Sign-off"
      description: >
        The CTO as designated HIPAA Security Officer must sign off on the
        Production Impact Assessment above. This sign-off is the documented
        evidence that the security incident was assessed per §164.308(a)(6).
        Enter N/A if this is not a production defect.
      placeholder: "Full name: [CTO name] | Date: YYYY-MM-DD | N/A — not a production defect"
    validations:
      required: true

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 4 — ROOT CAUSE AND CAPA
  # ─────────────────────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ---
        ## Section 4 — Root Cause & CAPA
        > **Purpose:** Identify why the defect existed (root cause) and what will
        > prevent it recurring (preventive action). These three fields together
        > constitute the CAPA record for this defect under QMSR §820.100.
        > For a 4-person team, the GitHub issue is the CAPA record — there is no
        > separate document required, provided all three fields below are completed.
        > The GitHub issue number is also the CAPA ID.
        > *Regulatory basis: QMSR §820.100(a)(2)(3)(7)*

  - type: textarea
    id: root_cause
    attributes:
      label: Root Cause
      description: >
        Answer: why did this defect exist? Not what it was — that is in Section 2.
        Identify the underlying cause: a missing test, a requirements gap, a
        code pattern error, a review miss, or a process gap. One sentence minimum.
        QMSR §820.100(a)(2) explicitly requires root cause identification — a fix
        description alone does not satisfy this requirement.
      placeholder: |
        Root cause: [One sentence answering WHY this defect existed]
        Example: "No unit test existed covering the case where oneDObjectData is
        passed by reference into an immer draft without shallow cloning."

        Root cause category (select one):
        [ ] Missing test coverage
        [ ] Requirements / specification gap
        [ ] Code logic error
        [ ] Code review miss
        [ ] Process gap
    validations:
      required: true

  - type: textarea
    id: preventive_action
    attributes:
      label: Preventive Action
      description: >
        Answer: what change (to tests, process, tooling, or code standards) will
        prevent this class of defect from recurring? Must be specific and
        implementable — not a general statement like "improve code quality."
        One sentence minimum. QMSR §820.100(a)(3) requires a preventive action
        separate from the corrective action (the fix itself).
      placeholder: |
        Preventive action: [One sentence describing what will prevent recurrence]
        Example: "Add a unit test asserting shallow-clone decoupling for all
        handleSnapshotToReport callers and add it to the CI gate so future
        PRs cannot regress this behaviour."

        Owner: [Name of person responsible for implementing the preventive action]
        Target date: [YYYY-MM-DD]
    validations:
      required: true

  - type: input
    id: capa_effectiveness_date
    attributes:
      label: CAPA Effectiveness Check Date
      description: >
        Set a future date to verify that the fix held and the preventive action
        is working. Typically one full release cycle after this issue is closed.
        On this date the CTO reviews: (1) has the defect recurred? (2) is the
        preventive action in place and active? QMSR §820.100(a)(7) explicitly
        requires effectiveness verification — this field provides the scheduled
        evidence that it will happen.
      placeholder: "YYYY-MM-DD (typically 4-8 weeks after closure)"
    validations:
      required: true

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 5 — ACCEPTANCE CRITERIA
  # ─────────────────────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ---
        ## Section 5 — Acceptance Criteria
        > **Purpose:** Define verifiable criteria that confirm the defect is fixed
        > and no regression has been introduced. Placed after the fix description
        > and root cause because meaningful criteria can only be written once the
        > fix approach is understood. Each criterion must have a corresponding
        > test case in Section 7.
        > *Regulatory basis: QMSR §820.30(c) · QMSR §820.30(f)*

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: >
        List each verifiable acceptance criterion. Each criterion must be specific
        and independently testable — avoid "works correctly" or "no longer crashes."
        Each criterion listed here must have a corresponding row in the Test
        Evidence table in Section 7. The number of criteria rows must match
        the number of test evidence rows.
      placeholder: |
        - [ ] [Criterion 1 — specific, testable statement of expected behaviour after fix]
        - [ ] [Criterion 2]
        - [ ] [Criterion 3 — regression: existing functionality unaffected by this fix]
    validations:
      required: true

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 6 — SECURITY, RISK AND HIPAA REVIEW
  # ─────────────────────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ---
        ## Section 6 — Security, Risk & HIPAA Review
        > **Purpose:** Assess the security, risk, and PHI impact of this fix.
        > Placed after the fix is fully described so the reviewer can assess
        > real impact rather than anticipated impact. The CTO completes this
        > section in dual role: as QMS approver (ISO 14971 risk owner) and
        > as HIPAA Security Officer (45 CFR §164).
        > *Regulatory basis: HIPAA §164.308(a)(1) · §164.312(a)(1) ·
        > §164.312(c)(1) · ISO 14971 §10.3 · QMSR §820.70*

  - type: checkboxes
    id: security_review
    attributes:
      label: Security & Privacy Checklist
      description: >
        Review each item in the context of this specific fix. All three must be
        confirmed before this issue can be closed. If any item cannot be checked,
        document the exception in the description field and obtain CTO sign-off
        before proceeding. These map to HIPAA §164.312 technical safeguard requirements.
      options:
        - label: "No PHI exposure introduced — this fix does not create a new path through which Protected Health Information could be accessed, transmitted, or disclosed without authorisation"
          required: true
        - label: "No secrets or credentials introduced — no API keys, passwords, tokens, or credentials appear in code, commit messages, or PR descriptions"
          required: true
        - label: "Existing authentication and access control unchanged — this fix does not modify who can access what, or how access is enforced; if changed, describe in Section 2"
          required: true
    validations:
      required: true

  - type: checkboxes
    id: risk_file_impact
    attributes:
      label: ISO 14971 Risk Management File Impact
      description: >
        Every change to a Class II SaMD must be evaluated against the ISO 14971
        Risk Management File. This evaluation must be documented even when the
        conclusion is "no impact" — the absence of a documented assessment is
        itself an audit finding. The CTO as risk owner must select one option
        and provide a rationale or risk item reference. This takes 2 minutes
        for most bug fixes.
      options:
        - label: "No impact on existing risk items — this fix does not introduce new hazards, remove existing risk controls, or change the probability or severity of any identified risk. Rationale: [replace this text with one sentence explaining why, e.g. fix is a shallow-clone of an internal data object with no patient-facing output]"
        - label: "Affects risk item [replace with Risk Item ID from Risk Management File] — updated risk rating: [Low / Medium / High] — CTO sign-off: [Name] Date: [YYYY-MM-DD]"
    validations:
      required: true

  - type: checkboxes
    id: hipaa_phi_impact
    attributes:
      label: HIPAA PHI Data Flow Impact
      description: >
        Assess whether this fix changes how PHI is created, read, updated, stored,
        transmitted, or displayed within HippoMind. This assessment is required
        under HIPAA §164.308(a)(1) Security Management Process for every change
        to a system that handles PHI. The CTO as HIPAA Security Officer must
        confirm one of the options below.
      options:
        - label: "This fix does not affect PHI data flows, PHI storage format, PHI display, or PHI access controls. Reason: [replace with one sentence, e.g. fix is confined to immer state management with no PHI fields involved]"
        - label: "This fix affects PHI handling — PHI data flow or access control change confirmed as unchanged or strengthened. Description: [replace with description of change and confirmation that controls are maintained or improved]"
    validations:
      required: true

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 7 — TEST EVIDENCE
  # ─────────────────────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ---
        ## Section 7 — Test Evidence
        > **Purpose:** Provide objective evidence that the fix was verified.
        > A checkbox or "tests pass" statement is not a quality record.
        > A quality record under QMSR §820.70(i) and ISO 13485 §4.2.5 must
        > identify: what was tested, the result, who tested it, when, and
        > against which software version (commit SHA).
        > The pre-filled table below must be completed before this issue is closed.
        > Row 1 onwards: one row per acceptance criterion from Section 5.
        > Final row: regression test confirming the fix does not reintroduce
        > the defect (IEC 62304 §5.7.4).
        > *Regulatory basis: QMSR §820.70(i) · ISO 13485 §4.2.5 ·
        > IEC 62304 §5.6 · IEC 62304 §5.7.4*

  - type: textarea
    id: test_evidence
    attributes:
      label: Test Evidence
      description: >
        Complete every column for every row. Tester must be a named individual
        (not "the team"). Commit SHA must be the exact SHA of the commit tested —
        not the branch name. Date must be the actual date testing was performed.
        Do not mark this issue Closed until all rows are complete.
        CI run URL: paste the URL of the passing CI run if available.
      value: |
        | # | Test Scenario | Expected Result | Actual Result | Pass / Fail | Tester | Date | Commit SHA |
        |---|---|---|---|---|---|---|---|
        | 1 | [Describe test scenario for Acceptance Criterion 1] | [What should happen] | [What actually happened] | [ ] Pass  [ ] Fail | [Tester name] | YYYY-MM-DD | [SHA] |
        | 2 | [Describe test scenario for Acceptance Criterion 2] | [What should happen] | [What actually happened] | [ ] Pass  [ ] Fail | [Tester name] | YYYY-MM-DD | [SHA] |
        | R | REGRESSION — defect does not recur: [describe the specific scenario that would reproduce the original defect] | Defect does not reproduce | [Actual result] | [ ] Fails pre-fix ✓  [ ] Passes post-fix ✓ | [Tester name] | YYYY-MM-DD | [SHA] |

        **CI Run URL (if available):** [paste URL of passing CI run]
        **Note:** Add rows as needed — one row per acceptance criterion. Row R (regression) is mandatory for all bug fixes.
    validations:
      required: true

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 8 — DEVELOPMENT TRACEABILITY
  # ─────────────────────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ---
        ## Section 8 — Development Traceability
        > **Purpose:** Link this QMS record to its implementing code change.
        > Provides the bidirectional traceability required by IEC 62304 §9.7:
        > from defect record → PR → commit → code. The PR description must
        > reference this issue's BUG-ID (from Section 1) in its Traceability
        > section so the link is navigable in both directions.
        > *Regulatory basis: IEC 62304 §9.7 · QMSR §820.30*

  - type: input
    id: pr_link
    attributes:
      label: Related Pull Request
      description: >
        Paste the full URL of the PR that implements this fix. The PR description
        must include the BUG-ID from Section 1 in its traceability section.
        If multiple PRs implement this fix, list all URLs separated by a line break.
        Do not close this issue before the implementing PR is merged.
      placeholder: "https://github.com/HippoClinicInc/[repo]/pull/[number]"
    validations:
      required: true

  # ─────────────────────────────────────────────────────────────────────────────
  # SECTION 9 — DEFINITION OF DONE AND QMS SIGN-OFF
  # ─────────────────────────────────────────────────────────────────────────────

  - type: markdown
    attributes:
      value: |
        ---
        ## Section 9 — Definition of Done & QMS Sign-off
        > **Purpose:** Confirm that all regulatory obligations for this defect
        > record are complete before the issue is closed. This section is the
        > closure gate — no item in the checklist may be unchecked at closure.
        > The GDrive URL field and Part 11 e-signature block together satisfy
        > QMSR §820.40 (record control) and 21 CFR Part 11 §11.50
        > (electronic signature manifestation).
        > *Regulatory basis: QMSR §820.40 · ISO 13485 §4.2.5 ·
        > 21 CFR Part 11 §11.10(b) · 21 CFR Part 11 §11.50*

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Definition of Done — Closure Checklist
      description: >
        All items must be checked before this issue is moved to Closed stage.
        This checklist is reviewed by the CTO as part of the QMS sign-off below.
        Any unchecked item at closure is an audit finding under ISO 13485 §7.3.6.
      options:
        - label: "Sections 1–8 above are fully completed — no placeholder text remains"
          required: true
        - label: "Test Evidence table (Section 7) is complete — all rows have tester name, date, and commit SHA; regression row R is completed"
          required: true
        - label: "Root cause and preventive action (Section 4) are documented — not placeholder text"
          required: true
        - label: "CAPA effectiveness check date (Section 4) is set to a future date"
          required: true
        - label: "Production Impact Assessment (Section 3 conditional block) is complete or all fields are marked N/A with reason"
          required: true
        - label: "Implementing PR is merged and linked in Section 8"
          required: true
        - label: "GDrive QMS record folder exists and URL is entered in the field below"
          required: true
    validations:
      required: true

  - type: input
    id: gdrive_url
    attributes:
      label: GDrive QMS Record URL
      description: >
        Paste the URL of the GDrive folder for this defect record. This folder
        must exist and must contain ALL of the following before this URL is pasted:
        (1) Test evidence log — exported or saved copy of the test evidence table above;
        (2) Root cause and preventive action record — can be a copy of Section 4 content;
        (3) Production Impact Assessment record — if detection stage was Production,
            the completed assessment including HIPAA Officer sign-off;
        (4) CAPA effectiveness check reminder — calendar entry or task set for the
            effectiveness check date entered in Section 4.
        Do not paste a URL that points to an empty or incomplete folder.
        Required for QMSR §820.40 record control and 21 CFR Part 11 §11.10(b)
        record retrieval obligations.
      placeholder: "https://drive.google.com/drive/folders/[folder-id]"
    validations:
      required: true

  - type: textarea
    id: part11_esignature
    attributes:
      label: 21 CFR Part 11 — QMS Electronic Signature
      description: >
        This block constitutes the electronic signature for this QMS record under
        21 CFR Part 11 §11.50. The CTO must replace the bracketed placeholders
        with actual values before this issue is closed. The GitHub account used
        to save this edit provides the identity binding and timestamp required
        by Part 11 §11.10(e). Tool validation reference: HC-VAL-GITHUB-001
        (GitHub validated as QMS record system — see GDrive: QMS/SOPs/HC-VAL-GITHUB-001).
        This signature applies to the entire content of this GitHub issue as the
        QMS change record for defect [BUG-ID from Section 1].
      value: |
        **21 CFR Part 11 §11.50 — Electronic Signature Manifestation**

        | Field | Value |
        |---|---|
        | Full printed name | [Replace with CTO full name] |
        | Date and time | [Replace with YYYY-MM-DD HH:MM] |
        | Role | CTO and HIPAA Security Officer, HippoClinic Inc. |
        | Meaning of this signature | I certify that this GitHub issue is a complete and accurate QMS change record for the above defect, that all mandatory fields have been completed, that the GDrive folder referenced above contains the required supporting records, and that this record complies with FDA QMSR (21 CFR Part 820), HIPAA (45 CFR §164), ISO 13485:2016, IEC 62304, and ISO 14971. |
        | Tool validation reference | HC-VAL-GITHUB-001 |

        *This signature is permanently linked to this GitHub issue. The GitHub edit
        history provides the immutable audit trail required by 21 CFR Part 11 §11.10(e).*
    validations:
      required: true
